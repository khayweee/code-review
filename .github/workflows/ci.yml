name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Check out the repository code so the workflow can run against this commit.
      - uses: actions/checkout@v7
      # Install uv and enable its cache so dependency setup is fast and repeatable.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      # Sync the project environment from the lockfile and pyproject metadata.
      - run: uv sync
      # Run the linter to catch style and static-analysis issues.
      - run: uv run ruff check .
      # Run type checking across the source tree.
      - run: uv run mypy src
      # Execute the test suite, parallelized across available cores -- tests are
      # independently isolated (own tmp_path/git repos/subprocesses), so this is safe and
      # cuts wall time substantially on the mix of real-subprocess and Textual-driven tests
      # here (see AGENTS.md's "Local verification sequence"). --dist=loadgroup keeps plain
      # load-balanced scheduling for everything else but pins every test carrying
      # tests/test_cli_review.py's `_REAL_PTY_FULL_RUN_GROUP` xdist_group marker to one
      # worker, so at most one real, animated `code-review review` pty subprocess runs at a
      # time -- see that marker's own comment for why several running concurrently was
      # enough contention on this runner's core count to push a real-pty test's exit-wait
      # past even a 60s bound.
      - run: uv run pytest -n auto --dist=loadgroup
