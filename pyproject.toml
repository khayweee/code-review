[project]
name = "code-review"
version = "0.2.0"
description = "Personal, from-scratch rebuild of a no-mistakes-style agentic code-review/gating pipeline."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "textual>=8.2.8",
    "typer>=0.12",
]

[project.scripts]
code-review = "code_review.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/code_review"]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
packages = ["code_review"]
mypy_path = "src"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
